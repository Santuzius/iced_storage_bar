[package]
name = "iced-storage-bar"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Alexander Menzel <menzel.alexander@proton.me>"]
description = "A rounded storage-usage bar for iced that colours itself by how full the quota is"
repository = "https://github.com/Santuzius/iced-storage-bar"
readme = "README.md"
keywords = ["iced", "widget", "progress", "storage", "quota"]
categories = ["gui"]

[dependencies]
# Only the widgets, so the crate brings no renderer, window system or executor of its own. Apps on an iced fork patch `iced_widget` with the fork's (`[patch.crates-io]`), so Cargo builds a single copy of iced.
iced_widget = "0.14"
